<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="400"
     viewBox="0 0 1200 400">

  <defs>

    <!-- Main gradient -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Clip -->
    <clipPath id="clip">
      <rect x="15" y="15" width="1170" height="370" rx="28"/>
    </clipPath>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200"
        height="400"
        fill="#080b14"/>

  <rect x="15"
        y="15"
        width="1170"
        height="370"
        rx="28"
        fill="#0b1020"
        stroke="url(#gradient)"
        stroke-width="2"/>


  <!-- ===================================================== -->
  <!-- BACKGROUND GLOW -->
  <!-- ===================================================== -->

  <ellipse cx="180"
           cy="100"
           rx="280"
           ry="180"
           fill="#a855f7"
           opacity="0.10"
           filter="url(#softGlow)"/>

  <ellipse cx="1050"
           cy="280"
           rx="300"
           ry="200"
           fill="#06b6d4"
           opacity="0.10"
           filter="url(#softGlow)"/>


  <!-- ===================================================== -->
  <!-- FLOATING PARTICLES -->
  <!-- ===================================================== -->

  <g fill="url(#gradient)">

    <circle cx="90" cy="90" r="3">
      <animate attributeName="cy"
               values="90;65;90"
               dur="4s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.3;1;0.3"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="190" cy="300" r="2">
      <animate attributeName="cy"
               values="300;270;300"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="310" cy="80" r="2">
      <animate attributeName="cy"
               values="80;105;80"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="880" cy="90" r="3">
      <animate attributeName="cy"
               values="90;65;90"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1040" cy="120" r="2">
      <animate attributeName="cy"
               values="120;150;120"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1090" cy="290" r="3">
      <animate attributeName="cy"
               values="290;260;290"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ===================================================== -->
  <!-- FLOATING KEYWORDS -->
  <!-- ===================================================== -->

  <g font-family="monospace"
     font-size="15"
     fill="#a78bfa"
     opacity="0.8">

    <text x="80" y="145">
      AI / ML
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 10 -12; 0 0"
        dur="5s"
        repeatCount="indefinite"/>
    </text>

    <text x="970" y="105">
      DATA SCIENCE
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -10 12; 0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </text>

    <text x="80" y="270">
      BLOCKCHAIN
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 12 8; 0 0"
        dur="4.5s"
        repeatCount="indefinite"/>
    </text>

    <text x="980" y="285">
      DEVELOPER
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -12 -8; 0 0"
        dur="5.5s"
        repeatCount="indefinite"/>
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- DECORATIVE ORBIT -->
  <!-- ===================================================== -->

  <g fill="none"
     stroke="url(#gradient)"
     opacity="0.5">

    <ellipse cx="1050"
             cy="200"
             rx="95"
             ry="35"
             stroke-width="1"
             transform="rotate(-25 1050 200)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 1050 200"
        to="360 1050 200"
        dur="18s"
        repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1050"
             cy="200"
             rx="70"
             ry="25"
             stroke-width="1"
             transform="rotate(35 1050 200)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 1050 200"
        to="0 1050 200"
        dur="15s"
        repeatCount="indefinite"/>
    </ellipse>

  </g>


  <!-- ===================================================== -->
  <!-- TOP DECORATIVE LINE -->
  <!-- ===================================================== -->

  <line x1="65"
        y1="55"
        x2="330"
        y2="55"
        stroke="url(#gradient)"
        stroke-width="2"/>

  <line x1="870"
        y1="55"
        x2="1135"
        y2="55"
        stroke="url(#gradient)"
        stroke-width="2"/>


  <!-- ===================================================== -->
  <!-- CODE SYMBOL -->
  <!-- ===================================================== -->

  <text x="600"
        y="92"
        text-anchor="middle"
        font-family="monospace"
        font-size="24"
        fill="url(#textGradient)"
        filter="url(#glow)">

    &lt;/&gt;

    <animate
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ===================================================== -->
  <!-- MAIN NAME -->
  <!-- ===================================================== -->

  <text x="600"
        y="165"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="700"
        letter-spacing="2"
        fill="url(#textGradient)"
        filter="url(#glow)">

    DEVADARRSHA P D

    <animate
      attributeName="opacity"
      values="0.85;1;0.85"
      dur="4s"
      repeatCount="indefinite"/>

  </text>


  <!-- ===================================================== -->
  <!-- DIVIDER -->
  <!-- ===================================================== -->

  <line x1="290"
        y1="190"
        x2="910"
        y2="190"
        stroke="url(#gradient)"
        stroke-width="1"
        opacity="0.7"/>

  <circle cx="600"
          cy="190"
          r="4"
          fill="#22d3ee"
          filter="url(#glow)">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ===================================================== -->
  <!-- SUBTITLE -->
  <!-- ===================================================== -->

  <text x="600"
        y="225"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#e5e7eb">

    AI/ML Developer  |  Data Science Enthusiast  |  CS Student @ VIT Chennai

  </text>


  <!-- ===================================================== -->
  <!-- TERMINAL BOX -->
  <!-- ===================================================== -->

  <rect x="345"
        y="250"
        width="510"
        height="55"
        rx="12"
        fill="#090d18"
        stroke="url(#gradient)"
        stroke-width="1.5"/>


  <!-- Terminal dots -->

  <circle cx="365" cy="268" r="4" fill="#a855f7"/>
  <circle cx="380" cy="268" r="4" fill="#6366f1"/>
  <circle cx="395" cy="268" r="4" fill="#06b6d4"/>


  <!-- Terminal text -->

  <text x="600"
        y="287"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        fill="#e5e7eb">

    <tspan fill="#a855f7">&gt;</tspan>
    <tspan> Building </tspan>
    <tspan fill="#22d3ee">Intelligent Solutions</tspan>

    <animate
      attributeName="opacity"
      values="0.6;1;0.6"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ===================================================== -->
  <!-- BOTTOM FLOATING WORDS -->
  <!-- ===================================================== -->

  <g font-family="monospace"
     font-size="13"
     fill="#64748b">

    <text x="300" y="340">
      CREATE
    </text>

    <text x="455" y="340">
      •
    </text>

    <text x="575" y="340">
      INNOVATE
    </text>

    <text x="745" y="340">
      •
    </text>

    <text x="850" y="340">
      BUILD
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- BOTTOM GLOW LINE -->
  <!-- ===================================================== -->

  <path
    d="M80 365 Q300 325 500 365 T920 365 T1120 350"
    fill="none"
    stroke="url(#gradient)"
    stroke-width="2"
    opacity="0.7">

    <animate
      attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
      M80 365 Q300 325 500 365 T920 365 T1120 350;
      M80 350 Q300 380 500 350 T920 350 T1120 365;
      M80 365 Q300 325 500 365 T920 365 T1120 350
      "/>

  </path>


  <!-- ===================================================== -->
  <!-- CORNER DETAILS -->
  <!-- ===================================================== -->

  <path d="M40 90 V45 H85"
        fill="none"
        stroke="#a855f7"
        stroke-width="2"/>

  <path d="M1115 45 H1160 V90"
        fill="none"
        stroke="#22d3ee"
        stroke-width="2"/>

  <path d="M40 310 V355 H85"
        fill="none"
        stroke="#a855f7"
        stroke-width="2"/>

  <path d="M1115 355 H1160 V310"
        fill="none"
        stroke="#22d3ee"
        stroke-width="2"/>


</svg>
