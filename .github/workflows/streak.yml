name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 3:00 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Devadarrsha-P-D&background=080D16&border=1E293B&stroke=2563EB&ring=00E5FF&fire=8B5CF6&currStreakNum=FFFFFF&sideNums=00E5FF&currStreakLabel=38BDF8&sideLabels=60A5FA&dates=94A3B8&hide_border=true&border_radius=15
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
