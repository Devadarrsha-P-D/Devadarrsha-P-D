name: Generate Streak Stats SVG

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v4
        with:
          user_id: '223692173'
          background: '080D16'
          border: '1E293B'
          stroke: '2563EB'
          ring: '00E5FF'
          fire: '8B5CF6'
          currStreakNum: 'FFFFFF'
          sideNums: '00E5FF'
          currStreakLabel: '38BDF8'
          sideLabels: '60A5FA'
          dates: '94A3B8'
          hide_border: 'true'
          border_radius: '15'
          type: 'svg'
          output: 'github-streak-stats.svg'

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-streak-stats.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push
