  </text>

  <!-- Tech -->
  <text x="143" y="132"
        fill="#CBD5E1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14">
    Python · LSTM · 3D · AI
  </text>

</g>

<!-- Divider -->
<line x1="22" y1="160" x2="978" y2="160"
      stroke="#202733"/>

