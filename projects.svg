
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="510"
     viewBox="0 0 1000 510">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#090D14"/>
    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1000" height="510" rx="18" fill="url(#bg)"/>

<!-- Outer border -->
<rect x="1" y="1" width="998" height="508"
      rx="18" fill="none"
      stroke="#30363D"/>

<!-- ================= AIRCRAFT ================= -->

<g>

  <!-- Exact aircraft image -->
  <rect x="22" y="23" width="105" height="105"
        rx="14" fill="#111827"
        stroke="#30363D"/>

  <image href="https://raw.githubusercontent.com/Devadarrsha-P-D/Devadarrsha-P-D/main/Screenshot%202026-09-12%20194826.png"
         x="22" y="23"
         width="105" height="105"
         preserveAspectRatio="xMidYMid slice"
         clip-path="inset(0 round 14px)"/>

  <!-- Category -->
  <rect x="143" y="30"
